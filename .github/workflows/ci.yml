name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm run typecheck
        if: runner.os == 'Linux'
      - run: npm run test:coverage
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os == 'Windows'
      - run: npm run build
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: repograph-package
          path: '*.tgz'
