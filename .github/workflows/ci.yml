name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run ci
      - run: node scripts/prove-providers.mjs --cargo
      - name: Packed external consumer install and queries
        run: npm run package:proof
      - uses: actions/upload-artifact@v4
        with:
          name: repograph-${{ matrix.os }}-node-${{ matrix.node }}
          path: .cache/package/*.tgz
